[workspace]
resolver = "2"
members = ["crates/memvc-core", "crates/memvc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/grimmerk/memvc"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
globset = "0.4"
walkdir = "2"
fd-lock = "4"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
