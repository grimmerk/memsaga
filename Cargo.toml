[workspace]
resolver = "2"
members = ["crates/memsaga-core", "crates/memsaga"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/grimmerk/memsaga"
homepage = "https://memsaga.grimmer.io"
# The oldest toolchain that builds the locked dependencies (globset needs
# 1.88; checked with `cargo +1.88 test --locked`, and 1.87 fails).
rust-version = "1.88"

[workspace.dependencies]
# Published together; keep the version equal to workspace.package.version.
memsaga-core = { path = "crates/memsaga-core", version = "0.1.2" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
globset = "0.4"
walkdir = "2"
fd-lock = "4"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
