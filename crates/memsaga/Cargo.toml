[package]
name = "memsaga"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Version control and two-way sync for Claude Code's memory, skills, hooks and config, plus other files you choose, in a git repository you own."
readme = "../../README.md"
keywords = ["claude-code", "claude", "memory", "git", "sync"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "memsaga"
path = "src/main.rs"

[dependencies]
memsaga-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
